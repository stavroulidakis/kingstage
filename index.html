// Render ένα timeline item ανάλογα με τύπο
function renderShowItem(item, idx, show) {
  const itemId = item.id || idx;
  if (item.type === 'setlist') {
    const sl = data.setlists[item.setlistId];
    if (!sl) return `<div class="timeline-item missing" data-item-idx="${idx}">⚠ Ενότητα που λείπει <button class="ti-remove" data-remove-idx="${idx}">✕</button></div>`;
    const songCount = (sl.sections || []).reduce((sum, sec) => sum + sec.songIds.length, 0);
    const sampleTitles = [];
    sl.sections.forEach(sec => sec.songIds.forEach(sid => {
      const s = data.songs[sid];
      if (s && sampleTitles.length < 3) sampleTitles.push(s.title);
    }));
    const samples = sampleTitles.length > 0
      ? sampleTitles.join(' · ') + (songCount > 3 ? ` · +${songCount - 3}` : '')
      : 'Άδειο';
    return `
      <div class="timeline-item ti-setlist" data-item-idx="${idx}" data-setlist-id="${sl.id}">
        <div class="ti-handle" title="Σύρε για αναδιάταξη">⋮⋮</div>
        <div class="ti-icon">📋</div>
        <div class="ti-content">
          <div class="ti-title">${escapeHtml(sl.title)}</div>
          <div class="ti-meta">${songCount} ${songCount===1?'τραγούδι':'τραγούδια'} · ${escapeHtml(samples)}</div>
        </div>
        <button class="ti-remove" data-remove-idx="${idx}" title="Αφαίρεση">✕</button>
      </div>
    `;
  }
  if (item.type === 'song') {
    const s = data.songs[item.songId];
    if (!s) return `<div class="timeline-item missing" data-item-idx="${idx}">⚠ Τραγούδι που λείπει <button class="ti-remove" data-remove-idx="${idx}">✕</button></div>`;
    const tags = [];
    if (s.key) tags.push(s.key);
    if (s.bpm) tags.push(s.bpm + ' BPM');
    return `
      <div class="timeline-item ti-song" data-item-idx="${idx}" data-song-id="${s.id}">
        <div class="ti-handle" title="Σύρε για αναδιάταξη">⋮⋮</div>
        <div class="ti-icon">🎵</div>
        <div class="ti-content">
          <div class="ti-title">${escapeHtml(s.title)}</div>
          <div class="ti-meta">${tags.length ? escapeHtml(tags.join(' · ')) : 'Μεμονωμένο τραγούδι'}</div>
        </div>
        <button class="ti-remove" data-remove-idx="${idx}" title="Αφαίρεση">✕</button>
      </div>
    `;
  }
  if (item.type === 'note') {
    return `
      <div class="timeline-item ti-note" data-item-idx="${idx}">
        <div class="ti-handle" title="Σύρε για αναδιάταξη">⋮⋮</div>
        <div class="ti-icon">📝</div>
        <div class="ti-content">
          <div class="ti-note-text" contenteditable="true" data-note-idx="${idx}" data-placeholder="Γράψε σημείωση...">${escapeHtml(item.text || '')}</div>
        </div>
        <button class="ti-remove" data-remove-idx="${idx}" title="Αφαίρεση">✕</button>
      </div>
    `;
  }
  if (item.type === 'time') {
    return `
      <div class="timeline-item ti-time" data-item-idx="${idx}">
        <div class="ti-handle" title="Σύρε για αναδιάταξη">⋮⋮</div>
        <div class="ti-icon">⏱</div>
        <div class="ti-content">
          <div class="ti-time-text" contenteditable="true" data-time-idx="${idx}" data-placeholder="π.χ. 21:30 — Έναρξη">${escapeHtml(item.text || '')}</div>
        </div>
        <button class="ti-remove" data-remove-idx="${idx}" title="Αφαίρεση">✕</button>
      </div>
    `;
  }
  return '';
}

function bindShowItemEvents(show) {
  const main = document.getElementById('mainPanel');

  // Click στο setlist → opens setlist
  main.querySelectorAll('.ti-setlist').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('button') || e.target.closest('.ti-handle')) return;
      openSetlist(el.dataset.setlistId);
    });
  });

  // Click στο song → opens song
  main.querySelectorAll('.ti-song').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('button') || e.target.closest('.ti-handle')) return;
      openSong(el.dataset.songId);
    });
  });

  // Edit note text
  main.querySelectorAll('.ti-note-text').forEach(el => {
    el.addEventListener('blur', () => {
      const idx = parseInt(el.dataset.noteIdx);
      if (show.items[idx]) {
        show.items[idx].text = el.innerText.trim();
        show.updatedAt = Date.now();
        saveData();
      }
    });
  });

  // Edit time text
  main.querySelectorAll('.ti-time-text').forEach(el => {
    el.addEventListener('blur', () => {
      const idx = parseInt(el.dataset.timeIdx);
      if (show.items[idx]) {
        show.items[idx].text = el.innerText.trim();
        show.updatedAt = Date.now();
        saveData();
      }
    });
  });

  // Remove buttons
  main.querySelectorAll('.ti-remove').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.removeIdx);
      show.items.splice(idx, 1);
      show.updatedAt = Date.now();
      saveData();
      renderShowDetail(show.id);
      renderSidebar();
    });
  });

  // Drag & drop reorder
  main.querySelectorAll('.timeline-item').forEach(el => {
    el.draggable = true;
    el.addEventListener('dragstart', (e) => {
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', el.dataset.itemIdx); } catch(_) {}
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      main.querySelectorAll('.timeline-item').forEach(it => it.classList.remove('drag-over'));
    });
    el.addEventListener('dragover', (e) => {
      e.preventDefault();
      const dragging = main.querySelector('.dragging');
      if (dragging && dragging !== el) el.classList.add('drag-over');
    });
    el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
    el.addEventListener('drop', (e) => {
      e.preventDefault();
      el.classList.remove('drag-over');
      const fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
      const toIdx = parseInt(el.dataset.itemIdx);
      if (isNaN(fromIdx) || isNaN(toIdx) || fromIdx === toIdx) return;
      const moved = show.items.splice(fromIdx, 1)[0];
      show.items.splice(toIdx, 0, moved);
      show.updatedAt = Date.now();
      saveData();
      renderShowDetail(show.id);
    });
  });
}

function renderSongsList(sl) {
  const container = document.getElementById('songsListContainer');

  if (!section || section.songIds.length === 0) {

    return;
  }

  // Wrap σε ένα block για ομοιόμορφη εμφάνιση
  const listBlock = document.createElement('div');
  listBlock.className = 'section-block';
  listBlock.style.padding = '20px';

  section.songIds.forEach((songId, songIdx) => {
    const song = data.songs[songId];
    if (!song) return;
    const songEl = document.createElement('div');
    songEl.className = 'song-item';
    songEl.dataset.songId = song.id;
    songEl.dataset.sectionId = section.id;
    songEl.draggable = true;
    const tags = [];
    if (song.key) tags.push(`<span class="song-tag key">♪ ${escapeHtml(song.key)}</span>`);
    if (song.bpm) tags.push(`<span class="song-tag bpm">${escapeHtml(song.bpm)} BPM</span>`);
    if (song.tempo) tags.push(`<span class="song-tag">${escapeHtml(song.tempo)}</span>`);
    songEl.innerHTML = `
      <div class="drag-handle song-drag" title="Σύρε">⋮⋮</div>
      <button class="song-play-btn" title="Stage Mode"></button>
      <div class="song-info" title="Άνοιξε στίχους">
        <div class="song-title">${escapeHtml(song.title)}</div>
        <div class="song-tags">${tags.join('') || '<span style="color:var(--text-dim); font-size:11px;">—</span>'}</div>
      </div>
      <div class="song-actions">
        <button class="icon-btn-small danger" data-action="remove" title="Αφαίρεση">✕</button>
      </div>
    `;

    songEl.querySelector('.song-play-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      openStageMode(sl.id, song.id);
    });
    songEl.querySelector('[data-action="remove"]').addEventListener('click', (e) => {
      e.stopPropagation();
      section.songIds.splice(songIdx, 1);
      sl.updatedAt = Date.now();
      saveData(); renderSongsList(sl); renderSidebar();
    });
    songEl.addEventListener('click', (e) => {
      if (!e.target.closest('button')) openSong(song.id, sl.id);
    });

    attachSongDragSimple(songEl, sl, section);
    listBlock.appendChild(songEl);
  });

  container.appendChild(listBlock);
}

function attachSongDragSimple(songEl, sl, section) {
  songEl.addEventListener('dragstart', (e) => {
    e.stopPropagation();
    dragData = { type: 'song-simple', songId: songEl.dataset.songId };
    songEl.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', songEl.dataset.songId); } catch(_) {}
  });
  songEl.addEventListener('dragend', () => {
    songEl.classList.remove('dragging');
    document.querySelectorAll('.drag-over-song').forEach(el => el.classList.remove('drag-over-song'));
    dragData = null;
  });
  songEl.addEventListener('dragover', (e) => {
    if (!dragData || dragData.type !== 'song-simple') return;
    e.preventDefault();
    e.stopPropagation();
    if (songEl.dataset.songId !== dragData.songId) {
      songEl.classList.add('drag-over-song');
    }
  });
  songEl.addEventListener('dragleave', () => songEl.classList.remove('drag-over-song'));
  songEl.addEventListener('drop', (e) => {
    if (!dragData || dragData.type !== 'song-simple') return;
    e.preventDefault();
    e.stopPropagation();
    songEl.classList.remove('drag-over-song');
    const fromIdx = section.songIds.indexOf(dragData.songId);
    const toIdx = section.songIds.indexOf(songEl.dataset.songId);
    if (fromIdx < 0 || toIdx < 0) return;
    section.songIds.splice(fromIdx, 1);
    section.songIds.splice(toIdx, 0, dragData.songId);
    sl.updatedAt = Date.now();
    saveData();
    renderSongsList(sl);
  });
}

      const tags = [];

      if (song.bpm) tags.push(`<span class="song-tag bpm">${escapeHtml(song.bpm)} BPM</span>`);
      if (song.tempo) tags.push(`<span class="song-tag">${escapeHtml(song.tempo)}</span>`);
      songEl.innerHTML = `
        <div class="drag-handle song-drag" title="Σύρε">⋮⋮</div>
        <button class="song-play-btn" title="Άνοιξε στη σκηνή"></button>
        <div class="song-info">
          <div class="song-title">${escapeHtml(song.title)}</div>
          <div class="song-tags">${tags.join('') || '<span style="color:var(--text-dim); font-size:11px;">—</span>'}</div>
        </div>
        <div class="song-actions">
          <button class="icon-btn-small" data-action="edit" title="Επεξεργασία">✎</button>

      `;

      });

        e.stopPropagation();
        openSong(song.id);
      });
      songEl.querySelector('[data-action="remove"]').addEventListener('click', (e) => {
        e.stopPropagation();
        section.songIds.splice(songIdx, 1);
        sl.updatedAt = Date.now();
        saveData(); renderSections(sl); renderSidebar();
      });
      songEl.addEventListener('click', (e) => {

// ============= ADD SONG TO SECTION =============
function addSongToSection(sl, section) {
  const songs = Object.values(data.songs).sort((a,b) => a.title.localeCompare(b.title, 'el'));
  // Build a picker modal
  const picker = document.createElement('div');
  picker.className = 'modal-overlay active';
  // Καθαρίζω τίτλο - αν είναι _default, δείχνω "Τραγούδια"
  const sectionLabel = (section.title === '_default' || !section.title) ? sl.title : section.title;
  picker.innerHTML = `
    <div class="modal" style="max-width: 600px;">
      <div class="modal-title">Επιλογή τραγουδιών για: ${escapeHtml(sectionLabel)}</div>
      <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 12px; line-height: 1.5;">

      </div>
      <input type="text" class="modal-input" id="pickerSearch" placeholder="Αναζήτηση...">
      <div id="pickerCount" style="font-size: 12px; color: var(--gold); margin: 6px 4px; font-weight: 600;"></div>

        <button class="btn-ghost" id="pickerNewSong">＋ Νέο Τραγούδι</button>
        <button class="btn-primary" id="pickerDone">Έτοιμο</button>
      </div>
    </div>
  `;
  document.body.appendChild(picker);

  const updateCount = () => {
    const c = section.songIds.length;
    picker.querySelector('#pickerCount').textContent = c > 0 ? `✓ ${c} ${c === 1 ? 'τραγούδι' : 'τραγούδια'} στην ενότητα` : 'Δεν έχει επιλεγεί κανένα τραγούδι';
  };

  const renderList = (q) => {
    const ql = (q||'').toLowerCase();
    const list = picker.querySelector('#pickerList');
    list.innerHTML = '';
    if (songs.length === 0) {
      list.innerHTML = `<div class="empty-state" style="padding:30px 10px;"><div class="empty-state-text">Δεν υπάρχουν τραγούδια ακόμα.<br>Πάτα <strong>＋ Νέο Τραγούδι</strong>.</div></div>`;
      return;
    }
    const filtered = songs.filter(s => !ql || s.title.toLowerCase().includes(ql));
    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty-state" style="padding:30px 10px;"><div class="empty-state-text">Δεν βρέθηκαν τραγούδια</div></div>`;
      return;
    }
    filtered.forEach(s => {
      const item = document.createElement('div');
      const inSection = section.songIds.includes(s.id);
      item.className = 'picker-song-item' + (inSection ? ' selected' : '');
      item.dataset.songId = s.id;
      item.innerHTML = `
        <div class="picker-song-icon">♪</div>
        <div class="picker-song-info">
          <div class="picker-song-title">${escapeHtml(s.title)}</div>
          <div class="picker-song-meta">${[s.key, s.bpm?s.bpm+' BPM':null].filter(Boolean).join(' · ') || '—'}</div>
        </div>
        <div class="picker-song-status">${inSection ? '✓' : '＋'}</div>
      `;
      item.addEventListener('click', () => {
        const isCurrentlyIn = section.songIds.includes(s.id);
        if (isCurrentlyIn) {
          // Toggle off
          section.songIds = section.songIds.filter(id => id !== s.id);
          item.classList.remove('selected');
          item.querySelector('.picker-song-status').textContent = '＋';
          toast(`"${s.title}" αφαιρέθηκε`);
        } else {
          // Toggle on
          section.songIds.push(s.id);
          item.classList.add('selected');
          item.querySelector('.picker-song-status').textContent = '✓';
          // Quick highlight animation
          item.classList.add('just-added');
          setTimeout(() => item.classList.remove('just-added'), 600);
          toast(`✓ "${s.title}" προστέθηκε`);
        }
        sl.updatedAt = Date.now();
        saveData();
        renderSidebar();
        // Δεν κλείνω το παράθυρο - μένει ανοιχτό
        updateCount();
      });
      list.appendChild(item);
    });
  };
  renderList('');
  updateCount();

  picker.querySelector('#pickerSearch').addEventListener('input', (e) => renderList(e.target.value));

  picker.querySelector('#pickerDone').addEventListener('click', () => {
    document.body.removeChild(picker);
    // Refresh setlist view
    if (typeof renderSongsList === 'function' && state.currentView === 'setlist') {
      renderSongsList(sl);
    } else if (typeof renderSections === 'function' && state.currentView === 'setlist') {
      renderSections(sl);
    }
  });

  picker.querySelector('#pickerNewSong').addEventListener('click', () => {
    openModal('Νέο Τραγούδι', 'Όνομα τραγουδιού', '', (title) => {
      const id = uid();
      data.songs[id] = { id, title, key:'', bpm:'', tempo:'', notes:'', lyrics:'', createdAt: Date.now() };
      section.songIds.push(id);
      sl.updatedAt = Date.now();
      saveData();
      // Προσθήκη του νέου τραγουδιού στη λίστα songs
      songs.push(data.songs[id]);
      songs.sort((a,b) => a.title.localeCompare(b.title, 'el'));
      renderList(picker.querySelector('#pickerSearch').value || '');
      updateCount();
      renderSidebar();
      toast(`✓ Δημιουργήθηκε & προστέθηκε`);
    });
  });

  picker.addEventListener('click', (e) => {
    if (e.target === picker) {
      document.body.removeChild(picker);
      if (typeof renderSongsList === 'function' && state.currentView === 'setlist') {
        renderSongsList(sl);
      }
    }
  });
}

// ============= DRAG & DROP =============
let dragData = null;

function attachSectionDrag(block, sl) {
  const handle = block.querySelector('.section-drag');

  block.addEventListener('dragstart', (e) => {
    if (!e.target.closest('.section-drag') && e.target !== block) {
      // Only allow drag from handle on desktop, or from block itself
    }
    dragData = { type: 'section', id: block.dataset.sectionId, slId: sl.id };
    block.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', block.dataset.sectionId); } catch(_) {}
  });

  block.addEventListener('dragend', () => {
    block.classList.remove('dragging');
    document.querySelectorAll('.drag-over-section').forEach(el => el.classList.remove('drag-over-section'));
    dragData = null;
  });

  block.addEventListener('dragover', (e) => {
    if (!dragData || dragData.type !== 'section') return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    if (block.dataset.sectionId !== dragData.id) {
      block.classList.add('drag-over-section');
    }
  });

  block.addEventListener('dragleave', (e) => {
    if (!block.contains(e.relatedTarget)) block.classList.remove('drag-over-section');
  });

  block.addEventListener('drop', (e) => {
    if (!dragData || dragData.type !== 'section') return;
    e.preventDefault();
    block.classList.remove('drag-over-section');
    const fromId = dragData.id;
    const toId = block.dataset.sectionId;
    if (fromId === toId) return;
    const fromIdx = sl.sections.findIndex(s => s.id === fromId);
    const toIdx = sl.sections.findIndex(s => s.id === toId);
    if (fromIdx < 0 || toIdx < 0) return;
    const [moved] = sl.sections.splice(fromIdx, 1);
    sl.sections.splice(toIdx, 0, moved);
    sl.updatedAt = Date.now();
    saveData();
    renderSections(sl);
  });

  // Touch support for sections via handle
  attachTouchDrag(handle, block, () => {
    return Array.from(document.querySelectorAll('.section-block'));
  }, (fromIdx, toIdx) => {
    if (fromIdx === toIdx) return;
    const [moved] = sl.sections.splice(fromIdx, 1);
    sl.sections.splice(toIdx, 0, moved);
    sl.updatedAt = Date.now();
    saveData();
    renderSections(sl);
  });
}

function attachSongDrag(songEl, sl) {
  songEl.addEventListener('dragstart', (e) => {
    e.stopPropagation();
    dragData = { type: 'song', songId: songEl.dataset.songId, sectionId: songEl.dataset.sectionId };
    songEl.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', songEl.dataset.songId); } catch(_) {}
  });

  songEl.addEventListener('dragend', () => {
    songEl.classList.remove('dragging');
    document.querySelectorAll('.drag-over-song').forEach(el => el.classList.remove('drag-over-song'));
    dragData = null;
  });

  songEl.addEventListener('dragover', (e) => {
    if (!dragData || dragData.type !== 'song') return;
    e.preventDefault();
    e.stopPropagation();
    if (songEl.dataset.songId !== dragData.songId || songEl.dataset.sectionId !== dragData.sectionId) {
      songEl.classList.add('drag-over-song');
    }
  });

  songEl.addEventListener('dragleave', () => songEl.classList.remove('drag-over-song'));

  songEl.addEventListener('drop', (e) => {
    if (!dragData || dragData.type !== 'song') return;
    e.preventDefault();
    e.stopPropagation();
    songEl.classList.remove('drag-over-song');
    const fromSection = sl.sections.find(s => s.id === dragData.sectionId);
    const toSection = sl.sections.find(s => s.id === songEl.dataset.sectionId);
    if (!fromSection || !toSection) return;
    const fromIdx = fromSection.songIds.indexOf(dragData.songId);
    const toIdx = toSection.songIds.indexOf(songEl.dataset.songId);
    if (fromIdx < 0) return;
    fromSection.songIds.splice(fromIdx, 1);
    if (fromSection === toSection && fromIdx < toIdx) {
      toSection.songIds.splice(toIdx, 0, dragData.songId);
    } else {
      toSection.songIds.splice(toIdx < 0 ? toSection.songIds.length : toIdx, 0, dragData.songId);
    }
    sl.updatedAt = Date.now();
    saveData();
    renderSections(sl);
  });
}

// Touch drag for tablets
function attachTouchDrag(handle, item, getItemsList, onMove) {
  let touchStart = null;
  let placeholder = null;
  let originalIdx = -1;

  handle.addEventListener('touchstart', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const touch = e.touches[0];
    touchStart = { x: touch.clientX, y: touch.clientY };
    const items = getItemsList();
    originalIdx = items.indexOf(item);

    item.style.transition = 'none';
    item.style.zIndex = '1000';
    item.style.opacity = '0.85';
    item.style.boxShadow = '0 10px 40px rgba(0,0,0,0.6)';
  }, { passive: false });

  handle.addEventListener('touchmove', (e) => {
    if (!touchStart) return;
    e.preventDefault();
    e.stopPropagation();
    const touch = e.touches[0];
    const dy = touch.clientY - touchStart.y;
    item.style.transform = `translateY(${dy}px)`;

    // Check overlapping items
    const items = getItemsList();
    const itemRect = item.getBoundingClientRect();
    const itemMid = itemRect.top + itemRect.height/2;
    items.forEach((other, idx) => {
      if (other === item) return;
      const r = other.getBoundingClientRect();
      const isOver = itemMid > r.top && itemMid < r.bottom;
      other.style.transition = 'transform 0.2s ease';
      if (isOver) other.style.background = 'var(--bg-light)';
      else other.style.background = '';
    });
  }, { passive: false });

  handle.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    item.style.transition = 'all 0.2s ease';
    item.style.transform = '';
    item.style.opacity = '';
    item.style.zIndex = '';
    item.style.boxShadow = '';

    const items = getItemsList();
    const itemRect = item.getBoundingClientRect();
    const itemMid = itemRect.top + itemRect.height/2;
    let newIdx = originalIdx;
    items.forEach((other, idx) => {
      if (other === item) return;
      other.style.background = '';
      const r = other.getBoundingClientRect();
      if (itemMid > r.top && itemMid < r.bottom) {
        newIdx = idx;
      }
    });

    if (newIdx !== originalIdx) onMove(originalIdx, newIdx);
    touchStart = null;
    originalIdx = -1;
  });
}

// =================================================
// LYRICS TOOLBAR (Bold/Italic/Underline + font/size/spacing)
// =================================================
function setupLyricsToolbar(editorEl, song) {
  // Default values per song
  song.lyricsFont = song.lyricsFont || 'Source Sans 3';
  song.lyricsSize = song.lyricsSize || 18;
  song.lyricsLineHeight = song.lyricsLineHeight || 1.7;

  // Smart fallback: serif fonts get serif fallback, others get sans-serif
  const SERIF_FONTS = ['Lora', 'Merriweather', 'Cormorant Garamond', 'EB Garamond', 'Crimson Text', 'Georgia'];
  const getFallback = (font) => SERIF_FONTS.includes(font) ? 'Georgia, serif' : 'Helvetica, Arial, sans-serif';

  // Apply current style — με !important για να υπερισχύει
  const applyStyle = () => {
    const fallback = getFallback(song.lyricsFont);
    editorEl.style.setProperty('font-family', `'${song.lyricsFont}', ${fallback}`, 'important');
    editorEl.style.setProperty('font-size', song.lyricsSize + 'px', 'important');
    editorEl.style.setProperty('line-height', song.lyricsLineHeight, 'important');
  };
  applyStyle();

  // Font selector
  const fontSelect = document.getElementById('lyricsFontSelect');
  if (fontSelect) {
    fontSelect.value = song.lyricsFont;
    fontSelect.addEventListener('change', () => {
      song.lyricsFont = fontSelect.value;
      song.updatedAt = Date.now();
      saveData();
      applyStyle();
      toast(`✓ Γραμματοσειρά: ${song.lyricsFont}`);
    });
  }

  // Update toolbar button states
  const updateToolbarState = () => {
    document.querySelectorAll('.toolbar-btn[data-cmd]').forEach(btn => {
      const cmd = btn.dataset.cmd;
      if (['bold','italic','underline'].includes(cmd)) {
        try {
          btn.classList.toggle('active', document.queryCommandState(cmd));
        } catch(_) {}
      }
    });
  };

  editorEl.addEventListener('keyup', updateToolbarState);
  editorEl.addEventListener('mouseup', updateToolbarState);
  editorEl.addEventListener('focus', updateToolbarState);

  // Paste handler — καθαρίζει styles από copy/paste internet
  editorEl.addEventListener('paste', (e) => {
    e.preventDefault();
    // Πάρε ΜΟΝΟ το plain text — αγνόησε html/styles από πηγή
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    if (!text) return;
    // Insert ως plain text — θα κληρονομήσει αυτόματα το style του editor
    if (document.queryCommandSupported && document.queryCommandSupported('insertText')) {
      document.execCommand('insertText', false, text);
    } else {
      // Fallback για παλιότερους browsers
      const sel = window.getSelection();
      if (!sel.rangeCount) return;
      const range = sel.getRangeAt(0);
      range.deleteContents();
      const lines = text.split('\n');
      lines.forEach((line, i) => {
        if (i > 0) range.insertNode(document.createElement('br'));
        if (line) range.insertNode(document.createTextNode(line));
        range.collapse(false);
      });
      sel.removeAllRanges();
      sel.addRange(range);
    }
    // Trigger save
    song.lyrics = editorEl.innerHTML;
    song.updatedAt = Date.now();
    saveData();
    toast('✓ Επικολλήθηκε καθαρό κείμενο');
  });

  // Toolbar buttons
  document.querySelectorAll('.toolbar-btn[data-cmd]').forEach(btn => {
    btn.addEventListener('mousedown', (e) => e.preventDefault()); // keep selection
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const cmd = btn.dataset.cmd;
      editorEl.focus();
      if (cmd === 'bold' || cmd === 'italic' || cmd === 'underline') {
        document.execCommand(cmd, false, null);
        updateToolbarState();
      } else if (cmd === 'fontSize-up') {
        song.lyricsSize = Math.min(48, song.lyricsSize + 2);
        applyStyle();
      } else if (cmd === 'fontSize-down') {
        song.lyricsSize = Math.max(12, song.lyricsSize - 2);
        applyStyle();
      } else if (cmd === 'lineHeight-up') {
        song.lyricsLineHeight = Math.min(3.5, parseFloat((song.lyricsLineHeight + 0.15).toFixed(2)));
        applyStyle();
      } else if (cmd === 'lineHeight-down') {
        song.lyricsLineHeight = Math.max(1.0, parseFloat((song.lyricsLineHeight - 0.15).toFixed(2)));
        applyStyle();
      } else if (cmd === 'clearFormat') {
        document.execCommand('removeFormat', false, null);
      }
      song.updatedAt = Date.now();
      saveData();
      // Save lyrics HTML on any toolbar action
      song.lyrics = editorEl.innerHTML;
      saveData();
    });
  });

  // Keyboard shortcuts
  editorEl.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey) {
      if (e.key === 'b' || e.key === 'B') { e.preventDefault(); document.execCommand('bold'); updateToolbarState(); }
      if (e.key === 'i' || e.key === 'I') { e.preventDefault(); document.execCommand('italic'); updateToolbarState(); }
      if (e.key === 'u' || e.key === 'U') { e.preventDefault(); document.execCommand('underline'); updateToolbarState(); }
    }
  });
}

  const meta = [];
  if (sl.venue) meta.push(`📍 ${escapeHtml(sl.venue)}`);
  if (sl.date) {
    const d = new Date(sl.date + 'T00:00:00');
    meta.push(`📅 ${d.toLocaleDateString('el-GR', { day:'numeric', month:'long', year:'numeric' })}`);
  }
  document.getElementById('stageMeta').innerHTML = meta.join(' · ');

  // Build sidebar - απλή λίστα τραγουδιών
  const sidebar = document.getElementById('stageSidebar');
  const fullList = document.getElementById('stageListFullscreen');
  sidebar.innerHTML = '';
  fullList.innerHTML = `<div class="stage-list-title">${escapeHtml(sl.title)}</div>`;
  let firstSongId = null;
  let counter = 0;
  sl.sections.forEach(section => {
    if (section.songIds.length === 0) return;
    section.songIds.forEach(sid => {
      const s = data.songs[sid];
      if (!s) return;
      counter++;
      if (!firstSongId) firstSongId = sid;

      // Sidebar item (small, για mode στίχων)
      const item = document.createElement('div');
      item.className = 'stage-song-item';
      item.dataset.songId = sid;
      item.innerHTML = `<span class="stage-song-num">${counter}</span><span>${escapeHtml(s.title)}</span>`;
      item.addEventListener('click', () => playStageSong(sid));
      sidebar.appendChild(item);

      // Fullscreen list item (big, για mode λίστας)
      const bigItem = document.createElement('div');
      bigItem.className = 'stage-list-item-big';
      bigItem.dataset.songId = sid;
      const tagsArr = [];
      if (s.key) tagsArr.push(s.key);
      if (s.bpm) tagsArr.push(s.bpm + ' BPM');
      const tagsText = tagsArr.length > 0 ? `<span class="stage-list-tags">${escapeHtml(tagsArr.join(' · '))}</span>` : '';
      bigItem.innerHTML = `
        <div class="stage-list-num">${counter}</div>
        <div class="stage-list-name">${escapeHtml(s.title)}</div>
        ${tagsText}
      `;
      bigItem.addEventListener('click', () => playStageSong(sid));
      fullList.appendChild(bigItem);
    });
  });

  document.getElementById('stageMode').classList.add('active');
  // Default: lyrics view
  document.getElementById('stageMode').classList.remove('list-only');
  updateStageViewToggle();

  if (songId) playStageSong(songId);
  else if (firstSongId) playStageSong(firstSongId);
  else {
    document.getElementById('stageMain').innerHTML = `<div class="stage-empty">Δεν υπάρχουν τραγούδια<br>σε αυτό το setlist</div>`;
  }
}

function updateStageViewToggle() {

function openStageModeStandalone(songId) {
  state.stage.setlistId = null;
  state.stage.standalone = true;
  const song = data.songs[songId];
  if (!song) return;
  document.getElementById('stageTitle').textContent = song.title;
  document.getElementById('stageMeta').innerHTML = '';
  const sidebar = document.getElementById('stageSidebar');
  sidebar.innerHTML = `<div class="stage-section-title">Τραγούδι</div>`;
  const item = document.createElement('div');
  item.className = 'stage-song-item playing';
  item.innerHTML = `<span class="stage-song-num">♪</span><span>${escapeHtml(song.title)}</span>`;
  sidebar.appendChild(item);
  document.getElementById('stageMode').classList.add('active');

function playStageSong(songId) {
  const song = data.songs[songId];
  if (!song) return;
  state.stage.currentSongId = songId;

  // Highlight in sidebar (lyrics mode)
  document.querySelectorAll('.stage-song-item').forEach(el => {
    el.classList.toggle('playing', el.dataset.songId === songId);
  });

  // Highlight in fullscreen list (list-only mode) — current + next-up
  const bigItems = document.querySelectorAll('.stage-list-item-big');
  bigItems.forEach(el => {
    el.classList.remove('current', 'next-up');
  });
  const currentIdx = Array.from(bigItems).findIndex(el => el.dataset.songId === songId);
  if (currentIdx >= 0) {
    bigItems[currentIdx].classList.add('current');
    if (currentIdx + 1 < bigItems.length) {
      bigItems[currentIdx + 1].classList.add('next-up');
    }
    // Scroll το current item στη μέση της οθόνης
    setTimeout(() => {
      bigItems[currentIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 50);
  }

  // Render main
  const main = document.getElementById('stageMain');
  const meta = [];
  if (song.key) meta.push(`Τόνος: <strong>${escapeHtml(song.key)}</strong>`);
  if (song.bpm) meta.push(`<strong>${escapeHtml(song.bpm)}</strong> BPM`);
  if (song.tempo) meta.push(`<strong>${escapeHtml(song.tempo)}</strong>`);

  // Apply per-song lyrics font/lineHeight to Stage
  const lyricsFont = song.lyricsFont || 'Source Sans 3';
  const lyricsLineHeight = song.lyricsLineHeight || 1.7;
  // Smart fallback
  const SERIF_FONTS_STAGE = ['Lora', 'Merriweather', 'Cormorant Garamond', 'EB Garamond', 'Crimson Text', 'Georgia'];
  const lyricsFallback = SERIF_FONTS_STAGE.includes(lyricsFont) ? 'Georgia, serif' : 'Helvetica, Arial, sans-serif';
  // Render lyrics: αν είναι παλιό plain text, μπαίνει ως escaped· αν είναι ήδη HTML (από rich editor), περνάει όπως είναι
  const lyricsContent = song.lyrics || '';
  const isHtml = /<\/?(b|strong|i|em|u|br|div|span|p)\b/i.test(lyricsContent);
  const lyricsHtml = isHtml ? lyricsContent : escapeHtml(lyricsContent);

  main.innerHTML = `
    <div class="stage-song-display">
      <div class="stage-song-title">${escapeHtml(song.title)}</div>
      ${meta.length ? `<div class="stage-song-meta">${meta.join(' · ')}</div>` : ''}
      ${song.notes ? `<div class="stage-notes">${escapeHtml(song.notes)}</div>` : ''}
      <div class="stage-lyrics" id="stageLyrics" style="font-family:'${lyricsFont}', ${lyricsFallback} !important; font-size:${state.stage.fontSize}px; line-height:${lyricsLineHeight};">${lyricsHtml || 'Δεν έχουν προστεθεί στίχοι ακόμα.'}</div>
    </div>
  `;
  main.scrollTop = 0;

  // Update prev/next
  updateStageNavButtons();
}

function getStageSongList() {
  const sl = data.setlists[state.stage.setlistId];
  if (!sl) return [];
  const list = [];
  sl.sections.forEach(sec => sec.songIds.forEach(id => { if (data.songs[id]) list.push(id); }));
  return list;
}

function updateStageNavButtons() {
  const list = getStageSongList();
  const idx = list.indexOf(state.stage.currentSongId);
  document.getElementById('stagePrev').disabled = idx <= 0;
  document.getElementById('stageNext').disabled = idx < 0 || idx >= list.length - 1;
}

document.getElementById('stagePrev').addEventListener('click', () => {
  const list = getStageSongList();
  const idx = list.indexOf(state.stage.currentSongId);
  if (idx > 0) playStageSong(list[idx - 1]);
});
document.getElementById('stageNext').addEventListener('click', () => {
  const list = getStageSongList();
  const idx = list.indexOf(state.stage.currentSongId);
  if (idx >= 0 && idx < list.length - 1) playStageSong(list[idx + 1]);
});

document.getElementById('stageClose').addEventListener('click', () => {

document.getElementById('stageViewToggle').addEventListener('click', () => {

// Fullscreen button — Method 2: Fullscreen API
const fullscreenBtn = document.getElementById('fullscreenBtn');
if (fullscreenBtn) {
  fullscreenBtn.addEventListener('click', () => {
    const isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
    if (isFullscreen) {
      // Exit fullscreen
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      else if (document.msExitFullscreen) document.msExitFullscreen();
      fullscreenBtn.innerHTML = '⛶ Fullscreen';
    } else {
      // Enter fullscreen
      const elem = document.documentElement;
      if (elem.requestFullscreen) elem.requestFullscreen();
      else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
      fullscreenBtn.innerHTML = '⛶ Έξοδος';
    }
  });
  // Update button on fullscreen change
  ['fullscreenchange', 'webkitfullscreenchange', 'msfullscreenchange'].forEach(evt => {
    document.addEventListener(evt, () => {
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
      fullscreenBtn.innerHTML = isFs ? '⛶ Έξοδος' : '⛶ Fullscreen';
    });
  });
}

// Auto-scroll
let scrollInterval = null;
function startAutoScroll() {
  state.stage.autoScroll = true;
  document.getElementById('autoScrollBtn').classList.add('active');
  document.getElementById('autoScrollIndicator').classList.add('active');
  const main = document.getElementById('stageMain');
  scrollInterval = setInterval(() => {
    main.scrollTop += state.stage.autoScrollSpeed;
    if (main.scrollTop + main.clientHeight >= main.scrollHeight - 5) stopAutoScroll();
  }, 30);
}
function stopAutoScroll() {
  state.stage.autoScroll = false;
  document.getElementById('autoScrollBtn').classList.remove('active');
  document.getElementById('autoScrollIndicator').classList.remove('active');
  if (scrollInterval) { clearInterval(scrollInterval); scrollInterval = null; }
}
document.getElementById('autoScrollBtn').addEventListener('click', () => {
  if (state.stage.autoScroll) stopAutoScroll(); else startAutoScroll();
});

// Keyboard shortcuts in stage mode
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('stageMode').classList.contains('active')) return;
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); document.getElementById('stageNext').click(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); document.getElementById('stagePrev').click(); }
  if (e.key === 'Escape') document.getElementById('stageClose').click();
  if (e.key === '+' || e.key === '=') document.getElementById('fontUp').click();
  if (e.key === '-') document.getElementById('fontDown').click();
  if (e.key.toLowerCase() === 's') document.getElementById('autoScrollBtn').click();
});

document.getElementById('stageModeBtn').addEventListener('click', () => {
  // Pick the first available setlist or prompt
  const setlists = Object.values(data.setlists);
  if (state.currentView === 'setlist' && data.setlists[state.currentId]) {
    openStageMode(state.currentId);
  } else if (setlists.length > 0) {
    // Choose most recent
    const recent = setlists.sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0))[0];
    openStageMode(recent.id);
  } else {
    toast('Δημιούργησε πρώτα ένα setlist');
  }
});
